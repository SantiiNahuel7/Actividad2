<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Ejercicio 2</title>
    <link rel="stylesheet" href="style_contacto.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <header class="cabecera-fija">
            <nav>
                <a href="index.html">HOME</a> | <a href="contacto.html">CONTACTO</a>
            </nav>
        </header>

        <main class="contenido-contacto">
            
            <section class="caja-formulario">
                <form action="#" method="POST">
                    
                    <div class="fila-form">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="fila-form">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="fila-form">
                        <label for="telefono">Tel:</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>

                    <div class="fila-form-mensaje">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" required></textarea>
                    </div>

                    <div class="botones">
                        <button type="submit" class="btn-enviar">Enviar</button>
                        <button type="reset" class="btn-cancelar">Cancelar</button>
                    </div>

                </form>
            </section>

        </main>

        <footer class="pie-fijo">
            <p>Todos los derechos reservados</p>
        </footer>

    </div>

</body>
</html>
